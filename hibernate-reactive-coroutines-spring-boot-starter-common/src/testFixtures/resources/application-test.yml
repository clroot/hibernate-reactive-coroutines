spring:
  # Keep the regular tests non-web even though WebFlux is on the test classpath.
  # The event-loop sharing integration test enables reactive mode explicitly.
  main:
    web-application-type: none
  reactor:
    context-propagation: auto
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        reactive:
          pool-size: 5
