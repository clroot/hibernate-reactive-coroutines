name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          version=$(bash .github/scripts/resolve-release-version.sh \
            "$GITHUB_EVENT_NAME" "$RELEASE_TAG" "$MANUAL_VERSION" \
            "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseVersion=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "ORG_GRADLE_PROJECT_releaseTag=$RELEASE_TAG" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and verify
        run: ./gradlew validateReleaseVersion build

      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Generate SLSA Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            hibernate-reactive-coroutines-core/build/libs/*.jar
            hibernate-reactive-coroutines-spring-boot-starter/build/libs/*.jar
            hibernate-reactive-coroutines-spring-boot-starter-boot4/build/libs/*.jar
