name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Test release version resolver
        run: bash .github/scripts/test-resolve-release-version.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build koverXmlReport koverHtmlReport --warning-mode fail

      - name: Start PostgreSQL
        run: |
          docker run --detach --rm --name hrc-postgres \
            --publish 5432:5432 \
            --env POSTGRES_DB=hrc \
            --env POSTGRES_USER=hrc \
            --env POSTGRES_PASSWORD=hrc \
            postgres:16-alpine
          until docker exec hrc-postgres pg_isready --username hrc --dbname hrc; do
            sleep 1
          done

      - name: Smoke test Spring Boot example
        run: |
          ./gradlew :examples:spring-boot:run > spring-boot-example.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" || true' EXIT
          for attempt in {1..60}; do
            if response=$(curl --fail --silent http://localhost:8080/smoke); then
              test "$response" = "spring-boot-ok:1"
              exit
            fi
            sleep 1
          done
          cat spring-boot-example.log
          exit 1

      - name: Smoke test Ktor example
        run: |
          ./gradlew :examples:ktor:run > ktor-example.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" || true' EXIT
          for attempt in {1..60}; do
            if response=$(curl --fail --silent http://localhost:8081/smoke); then
              test "$response" = "ktor-ok:1"
              exit
            fi
            sleep 1
          done
          cat ktor-example.log
          exit 1

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/build/reports/tests/"

      - name: Upload Kover coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kover-coverage
          path: build/reports/kover/
